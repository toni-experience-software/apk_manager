android_sdk_config:
  add_gradle_deps: true
  android_example: 'example/'

summarizer:
  backend: asm

output:
  dart:
    path: lib/src/apk_manager_utils.dart
    structure: single_file

log_level: all

source_path:
  - 'android/src/main/kotlin'
classes:
  - 'com.wearetoni.apk_manager.ApkManagerPlugin'
  - 'com.wearetoni.apk_manager.InstallResultMsg'
  - 'com.wearetoni.apk_manager.PackageInfoMsg'
